server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html portal.html index.htm;

    # Automatically redirect any incoming URL ending in .html to remove it
    if ($request_uri ~ ^/(.*)\.html$) {
        return 301 /$1;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Proxy API calls directly to the Node.js backend container
    location /api/ {
        proxy_pass http://sadot-backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}